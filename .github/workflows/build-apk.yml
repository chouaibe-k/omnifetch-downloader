name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniFetch-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: OmniFetch v1.0.0 - Android APK Release
          body: |
            ### 📱 OmniFetch v1.0.0 Android Release
            Universal Social Media Video Downloader for Android and Web.
            
            #### Features:
            - **YouTube, TikTok, Facebook, Dailymotion & Instagram** support
            - **Quality selection**: 4K UHD, 1080p, 720p, 480p, 360p, and MP3 audio
            - **TikTok Clean Watermark Removal**: Clean HD vs Original with watermark
            - **Creator & Metadata**: Author handle, profile info, and video description
            - **Captions & Subtitles**: Direct .VTT / .SRT downloads
            
            Download `app-debug.apk` below and install it directly on your Android phone!
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
