<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFetch — Android Test Bench & Device Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-bench: #090d16;
      --bg-panel: #111827;
      --bg-elevated: #1a2234;
      --border-bench: #222e44;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --phone-bezel: #1e293b;
      --phone-outer: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-bench);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Bench Header */
    .bench-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-bench);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .bench-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .android-icon {
      color: #34d399;
      display: flex;
    }

    .bench-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .os-badge {
      font-size: 0.72rem;
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .bench-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ctrl-select, .ctrl-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-bench);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 150ms ease;
    }

    .ctrl-btn:hover, .ctrl-select:hover {
      background: #253147;
      border-color: #384867;
    }

    .ctrl-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Main Workspace */
    .bench-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      overflow: hidden;
    }

    .device-viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
      background: radial-gradient(circle at center, #131b2e 0%, #090d16 100%);
    }

    /* Phone Device Frame */
    .phone-frame {
      background: var(--phone-outer);
      border: 4px solid #334155;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px #475569;
      border-radius: 48px;
      padding: 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Screen Container */
    .phone-screen {
      background: #000;
      border-radius: 36px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #1e293b;
    }

    /* Dynamic Island / Punch Hole Notch */
    .camera-punchhole {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #000;
      border-radius: 50%;
      z-index: 100;
      border: 1px solid #222;
    }

    /* Android Status Bar */
    .android-status-bar {
      height: 34px;
      background: #0c111d;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 0.74rem;
      font-weight: 600;
      z-index: 90;
      flex-shrink: 0;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* App Frame (IFrame) */
    .app-iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #0c111d;
    }

    /* Android Gesture Navigation Pill */
    .android-nav-bar {
      height: 20px;
      background: #0c111d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      flex-shrink: 0;
    }

    .home-gesture-pill {
      width: 80px;
      height: 4px;
      background: #94a3b8;
      border-radius: 9999px;
    }

    /* FCM Push Notification Toast */
    .fcm-toast {
      position: absolute;
      top: 42px;
      left: 14px;
      right: 14px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 200;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: slideDown 300ms ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .toast-icon {
      width: 32px;
      height: 32px;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast-content {
      flex: 1;
      font-size: 0.78rem;
    }

    .toast-title {
      font-weight: 700;
      color: #fff;
    }

    .toast-msg {
      color: #cbd5e1;
    }

    /* Side Panel / Logcat */
    .bench-sidebar {
      background: var(--bg-panel);
      border-left: 1px solid var(--border-bench);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-bench);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logcat-container {
      flex: 1;
      background: #050811;
      padding: 12px 14px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      color: #94a3b8;
    }

    .log-line {
      display: flex;
      gap: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-tag-info { color: #38bdf8; }
    .log-tag-debug { color: #94a3b8; }
    .log-tag-warn { color: #fbbf24; }
    .log-tag-touch { color: #a78bfa; }

    /* Device Dimensions */
    .profile-pixel8pro { width: 412px; height: 892px; }
    .profile-s24ultra { width: 412px; height: 915px; }
    .profile-pixel8a { width: 390px; height: 844px; }
    .profile-fold { width: 673px; height: 841px; }

    .orientation-landscape {
      transform: rotate(90deg);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="bench-header">
    <div class="bench-title-row">
      <div class="android-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993.0001.5511-.4483.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5878 8.4239 13.854 8.125 12 8.125s-3.5878.2989-5.1368.8247L4.8409 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.7844h24c-.3432-4.1255-2.6889-7.5977-6.1185-9.463"/>
        </svg>
      </div>
      <h1 class="bench-title">Android Live Device Simulator</h1>
      <span class="os-badge">Android 15 (API 35)</span>
    </div>

    <div class="bench-controls">
      <!-- Device Model Profile -->
      <select id="deviceProfileSelect" class="ctrl-select" title="Device Model">
        <option value="profile-pixel8pro" selected>Pixel 8 Pro (412x892 dp)</option>
        <option value="profile-s24ultra">Galaxy S24 Ultra (412x915 dp)</option>
        <option value="profile-pixel8a">Pixel 8a Compact (390x844 dp)</option>
        <option value="profile-fold">Pixel Fold (673x841 dp)</option>
      </select>

      <!-- Rotate -->
      <button id="rotateBtn" class="ctrl-btn" title="Rotate Device">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Rotate</span>
      </button>

      <!-- Network Profile -->
      <select id="networkProfileSelect" class="ctrl-select" title="Network Throttling">
        <option value="5G">5G (Full Speed)</option>
        <option value="4G">4G LTE (15 Mbps)</option>
        <option value="3G">Slow 3G (1.5 Mbps)</option>
        <option value="Offline">Offline</option>
      </select>

      <!-- Trigger FCM Notification -->
      <button id="triggerFcmBtn" class="ctrl-btn" title="Send Mock FCM Heads-up Notification">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span>Test Push Notification</span>
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="bench-workspace">
    <!-- Viewport Area -->
    <div class="device-viewport">
      <div id="phoneFrame" class="phone-frame">
        <div id="phoneScreen" class="phone-screen profile-pixel8pro">
          <!-- Camera Punchhole -->
          <div class="camera-punchhole"></div>

          <!-- Android Status Bar -->
          <div class="android-status-bar">
            <div class="status-left">
              <span id="androidClock">12:30</span>
              <span style="font-size:0.65rem">🔔</span>
            </div>
            <div class="status-right">
              <span id="networkIcon">5G</span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/>
              </svg>
              <span>100%</span>
            </div>
          </div>

          <!-- Embedded App Frame -->
          <iframe id="appIframe" class="app-iframe" src="https://chouaibe-k.github.io/omnifetch-downloader/"></iframe>

          <!-- Android Gesture Nav Bar -->
          <div class="android-nav-bar">
            <div class="home-gesture-pill"></div>
          </div>

          <!-- FCM Notification Toast (Hidden by default) -->
          <div id="fcmToast" class="fcm-toast" style="display:none">
            <div class="toast-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </div>
            <div class="toast-content">
              <div class="toast-title">OmniFetch Downloader</div>
              <div class="toast-msg">TikTok Video (Clean HD) saved to device storage!</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Logcat Sidebar -->
    <aside class="bench-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          <span>Live Android Logcat</span>
        </div>
        <button id="clearLogsBtn" class="ctrl-btn" style="padding:2px 8px; font-size:0.7rem">Clear</button>
      </div>
      <div id="logcatStream" class="logcat-container">
        <!-- Log lines dynamically injected -->
      </div>
    </aside>
  </div>

  <script>
    (() => {
      const phoneScreen = document.getElementById('phoneScreen');
      const deviceProfileSelect = document.getElementById('deviceProfileSelect');
      const rotateBtn = document.getElementById('rotateBtn');
      const networkProfileSelect = document.getElementById('networkProfileSelect');
      const networkIcon = document.getElementById('networkIcon');
      const triggerFcmBtn = document.getElementById('triggerFcmBtn');
      const fcmToast = document.getElementById('fcmToast');
      const logcatStream = document.getElementById('logcatStream');
      const clearLogsBtn = document.getElementById('clearLogsBtn');
      const androidClock = document.getElementById('androidClock');

      // Update Clock
      function updateClock() {
        const d = new Date();
        const h = d.getHours().toString().padStart(2, '0');
        const m = d.getMinutes().toString().padStart(2, '0');
        androidClock.textContent = `${h}:${m}`;
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Logcat logger
      function log(tag, type, message) {
        const time = new Date().toISOString().substring(11, 23);
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = `<span style="color:#64748b">${time}</span> <span class="log-tag-${type}">[${tag}]</span> <span>${message}</span>`;
        logcatStream.appendChild(line);
        logcatStream.scrollTop = logcatStream.scrollHeight;
      }

      log('ActivityTaskManager', 'info', 'START u0 {act=android.intent.action.MAIN cat=[android.intent.category.LAUNCHER] cmp=com.omnifetch.app/.MainActivity}');
      log('WindowManager', 'info', 'Created window Surface(name=com.omnifetch.app/MainActivity)/@0x3f5c9');
      log('DownloadManager', 'debug', 'OmniFetch background service bound and ready.');

      // Device Profile Switching
      deviceProfileSelect.addEventListener('change', (e) => {
        phoneScreen.className = `phone-screen ${e.target.value}`;
        log('DeviceManager', 'info', `Display configuration changed to profile: ${e.target.value}`);
      });

      // Rotate
      let isRotated = false;
      rotateBtn.addEventListener('click', () => {
        isRotated = !isRotated;
        rotateBtn.classList.toggle('active', isRotated);
        phoneScreen.style.transform = isRotated ? 'rotate(90deg)' : 'none';
        log('WindowManager', 'info', `Orientation updated to ${isRotated ? 'LANDSCAPE_90' : 'PORTRAIT'}`);
      });

      // Network Profile
      networkProfileSelect.addEventListener('change', (e) => {
        const net = e.target.value;
        networkIcon.textContent = net;
        log('ConnectivityService', net === 'Offline' ? 'warn' : 'info', `Network state changed to ${net}`);
      });

      // FCM Notification
      triggerFcmBtn.addEventListener('click', () => {
        fcmToast.style.display = 'flex';
        log('FirebaseMessaging', 'info', 'Received FCM remote message: com.omnifetch.app.DOWNLOAD_COMPLETED');
        setTimeout(() => {
          fcmToast.style.display = 'none';
        }, 4000);
      });

      // Clear logs
      clearLogsBtn.addEventListener('click', () => {
        logcatStream.innerHTML = '';
      });

      // Monitor touch motion events on device viewport
      phoneScreen.addEventListener('click', (e) => {
        const rect = phoneScreen.getBoundingClientRect();
        const x = Math.round(e.clientX - rect.left);
        const y = Math.round(e.clientY - rect.top);
        log('MotionEvent', 'touch', `ACTION_UP x=${x} y=${y} pressure=1.0 size=0.04`);
      });
    })();
  </script>
</body>
</html>
